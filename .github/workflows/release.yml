name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches every version string
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "VERSION ${version}$" CMakeLists.txt
          grep -q "version = \"${version}\"" include/thediscordlist/dpp.h
          grep -q "\"version\": \"${version}\"" ports/thediscordlist-dpp/vcpkg.json
          grep -q "## ${version}" CHANGELOG.md

      - name: Install D++ and the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libssl-dev zlib1g-dev libopus-dev
          curl -fsSLo dpp.deb https://github.com/brainboxdotcc/DPP/releases/download/v10.1.6/libdpp-10.1.6-linux-x64.deb
          sudo apt-get install -y ./dpp.deb

      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Package the source
        run: |
          name="thediscordlist-dpp-${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="${name}/" -o "${name}.tar.gz" "$GITHUB_REF_NAME"
          sha512sum "${name}.tar.gz" > "${name}.tar.gz.sha512"

      # vcpkg_from_github downloads GitHub's own tag archive, so its hash is the one the
      # port needs, not the hash of the tarball attached above.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vcpkg_sha512=$(curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_REF_NAME}.tar.gz" | sha512sum | cut -d' ' -f1)
          gh release create "$GITHUB_REF_NAME" thediscordlist-dpp-*.tar.gz* \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md).

          vcpkg \`SHA512\` for \`ports/thediscordlist-dpp/portfile.cmake\`: \`${vcpkg_sha512}\`"
